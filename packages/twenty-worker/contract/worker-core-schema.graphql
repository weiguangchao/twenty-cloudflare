  eq: DateTime
  gt: DateTime
  gte: DateTime
  in: [DateTime!]
  lt: DateTime
  lte: DateTime
  neq: DateTime
  is: FilterIs
  gtField: String
  gteField: String
  ltField: String
  lteField: String
}

input StringFilter {
  eq: String
  gt: String
  gte: String
  in: [String!]
  lt: String
  lte: String
  neq: String
  startsWith: String
  endsWith: String

  """Pattern match with % wildcard (e.g. %value%)"""
  like: String

  """Case-insensitive match with % wildcard (e.g. %value%)"""
  ilike: String
  regex: String
  iregex: String
  is: FilterIs
}

