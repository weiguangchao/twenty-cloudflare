name: CI Knip

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'knip.json'
      - '.github/workflows/ci-knip.yaml'
      - 'nx.json'
      - 'package.json'
      - 'yarn.lock'
      - 'packages/crm-front/**'
      - 'packages/crm-oxlint-rules/**'
      - 'packages/crm-shared/**'
      - 'packages/crm-ui/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Run knip
        run: npx nx run-many -t knip --parallel=1
