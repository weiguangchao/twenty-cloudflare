name: CI Front Storybook Test

on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
        description: 'Storybook scope to test: modules, pages or performance'
      shard:
        type: number
        required: true
      shard-count:
        type: number
        required: true

permissions:
  contents: read

jobs:
  storybook-test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      REACT_APP_SERVER_BASE_URL: http://localhost:3000
      STORYBOOK_URL: http://localhost:6006
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Cache storybook vitest dependency optimizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/crm-front/node_modules/.cache/storybook
          key: v4-storybook-vitest-deps-crm-front-${{ inputs.scope }}-${{ hashFiles('yarn.lock', 'packages/crm-front/vite.config.ts', 'packages/crm-front/vitest.config.ts', 'packages/crm-front/.storybook/main.ts') }}
      - name: Build dependencies
        run: |
          npx nx build crm-shared
          npx nx build crm-ui
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: v4-playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/crm-front
        run: npx playwright install chromium
      - name: Write .env
        run: npx nx reset:env crm-front
      - name: Run storybook tests
        run: npx nx storybook:test:no-coverage crm-front --configuration=${{ inputs.scope }} --shard=${{ inputs.shard }}/${{ inputs.shard-count }}
