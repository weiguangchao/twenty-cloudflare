name: CI UI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci-ui.yaml'
      - 'packages/crm-ui/**'
      - 'packages/crm-shared/**'
      - 'packages/crm-oxlint-rules/scripts/check-unlocalized-strings.mjs'
      - 'packages/crm-oxlint-rules/scripts/filter-unlocalized-strings.mjs'
      - 'packages/crm-oxlint-rules/.oxlintrc.i18n.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-task:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Run ${{ matrix.task }}
        run: npx nx ${{ matrix.task }} crm-ui
      - name: Check generated theme artifacts are up to date
        if: matrix.task == 'lint'
        run: npx nx generate:check crm-ui
  ui-sb-test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build dependencies
        run: npx nx build crm-shared
      - name: Cache storybook vitest dependency optimizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/crm-ui/node_modules/.cache/storybook
            packages/crm-ui/node_modules/.vite
          key: v4-storybook-vitest-deps-crm-ui-${{ hashFiles('yarn.lock', 'packages/crm-ui/vite.config.ts', 'packages/crm-ui/vitest.config.ts', 'packages/crm-ui/.storybook/main.ts') }}
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: v4-playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/crm-ui
        run: npx playwright install chromium
      - name: Run storybook tests
        run: npx nx storybook:test:no-coverage crm-ui
