name: CI Front

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci-front.yaml'
      - '.github/workflows/ci-front-storybook-test.yaml'
      - 'packages/crm-front/**'
      - 'packages/crm-oxlint-rules/**'
      - 'packages/crm-ui/**'
      - 'packages/crm-shared/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-sb-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: modules, shard: 1, shard-count: 4 }
          - { scope: modules, shard: 2, shard-count: 4 }
          - { scope: modules, shard: 3, shard-count: 4 }
          - { scope: modules, shard: 4, shard-count: 4 }
          - { scope: pages, shard: 1, shard-count: 1 }
          - { scope: performance, shard: 1, shard-count: 1 }
    uses: ./.github/workflows/ci-front-storybook-test.yaml
    with:
      scope: ${{ matrix.scope }}
      shard: ${{ matrix.shard }}
      shard-count: ${{ matrix.shard-count }}
  front-task:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint }
          - { name: test, shard: 1 }
          - { name: test, shard: 2 }
          - { name: test, shard: 3 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Write .env
        run: npx nx reset:env crm-front
      - name: Lint
        if: matrix.name == 'lint'
        run: npx nx lint crm-front
      - name: Test
        if: matrix.name == 'test'
        run: npx nx test crm-front --configuration=ci --shard=${{ matrix.shard }}/3
